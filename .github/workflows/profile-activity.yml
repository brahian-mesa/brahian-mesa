name: Actualizar actividad del perfil

on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - .github/workflows/profile-activity.yml

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verificar generador
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Obtener actividad pública
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_activity.py
      - name: Guardar solo si hubo cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/activity.json assets/activity.svg
          if ! git diff --cached --quiet; then
            git commit -m 'docs: actualizar actividad pública del perfil'
            git push origin HEAD:main
          fi
